version: "3.9"
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_CONFIG=/etc/rust-api-gateway/config.yaml
      - RUST_LOG=info
    volumes:
      - ./config.yaml:/etc/rust-api-gateway/config.yaml:ro
    depends_on:
      - redis
